name: Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ mugesh-s-23 }}
          password: ${{ mighty@1006.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mugesh-s-23/https://github.com/Mugesh-S-23/docker-lab.git:latest
            ghcr.io/mugesh-s-23/https://github.com/Mugesh-S-23/docker-lab.git:${{ github.sha }}
